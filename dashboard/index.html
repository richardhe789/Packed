<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Crowd — Dining Hall Status</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <p class="brand">Campus Crowd</p>
      <h1>Should I go now?</h1>
      <p class="tagline">Live busyness from ambient WiFi density near dining halls.</p>
    </header>

    <main>
      <section aria-label="Locations" id="locations" class="locations">
        <!-- Rows rendered by app.js -->
      </section>
      <p class="meta" id="last-updated">Waiting for data…</p>
    </main>

    <footer>
      <p>
        Density is relative ambient WiFi activity — not a headcount, and never tracks
        individual devices.
      </p>
    </footer>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
