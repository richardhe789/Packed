; Packed — PlatformIO ESP32 ambient WiFi crowd density sensor
; Default is 30s windows so a judging-table demo can show density move.
[platformio]
default_envs = esp32dev_short

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/generate_location_header.py
build_flags =
	-DCORE_DEBUG_LEVEL=0
lib_deps =
	bblanchon/ArduinoJson@^7.2.1

; Same firmware with 30s windows for faster bench testing
[env:esp32dev_short]
extends = env:esp32dev
build_flags =
	${env:esp32dev.build_flags}
	-DSHORT_WINDOWS
